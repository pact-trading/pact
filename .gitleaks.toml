title = "Pact Pay source scan"
[extend]
useDefault = true

[allowlist]
description = "Reviewed public EVM token addresses, two recorded bytecode hashes, and unchanged upstream contract test vectors"
paths = ['''(?:^|/)contracts/lib/''']
regexTarget = "secret"
# Literal shell variable in copied Stripe documentation, not a credential.
stopwords = ["STRIPE_SECRET_KEY"]
regexes = [
  '''^0x[0-9a-fA-F]{40}$''',
  '''^0x4d9be648c5bf39973670d9f8b481d5d0b971e6a2db2deccc6b98cde21c5dd83e$''',
  '''^0x4d9be648c5bf39973670d9f8b481d5d0b971e6a2db2deccc6b98cde21c5dd83e$'''
]
